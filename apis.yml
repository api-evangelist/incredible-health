aid: incredible-health
name: Incredible Health
description: >-
  Incredible Health is an AI-native healthcare career marketplace that connects
  registered nurses, technicians, and technologists with permanent jobs at top
  hospitals and health systems. It flips traditional recruiting by having employers
  apply to pre-screened, verified professionals rather than the reverse. The platform
  serves 1.5 million+ U.S. healthcare workers and 1,500+ employers, including a
  majority of the nation's top-ranked hospital systems, cutting time-to-hire from a
  national average of roughly 86 days to under 20. Two purpose-built AI agents power
  the marketplace: Gale, a career partner for professionals (resume wizard, interview
  practice), and Lyn, a voice interview agent for employers that integrates with
  applicant-tracking systems. Founded by Iman Abuzeid, MD, and headquartered in San
  Francisco, the company is venture-backed by Andreessen Horowitz, Obvious Ventures,
  and NFX.
